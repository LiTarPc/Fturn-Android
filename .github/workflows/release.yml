name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v3.7.2)'
        required: false
        default: 'v3.7.2'

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-and-publish:
    name: Build APKs & attach to Release
    if: github.event_name != 'pull_request' || (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'codex/fix-beta-update-comparison')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Setup Keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::KEYSTORE_BASE64 is required for an updatable release APK"
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Assemble release APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Collect APKs
        id: collect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG="v3.7.2"
          else
            TAG="${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}"
          fi
          VERSION="${TAG#v}"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a; do
            if [ -f "app/build/outputs/apk/release/app-${abi}-release.apk" ]; then
              cp "app/build/outputs/apk/release/app-${abi}-release.apk" "dist/freeturn-${VERSION}-${abi}.apk"
            fi
          done
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create / Update GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.collect.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: FreeTurn ${{ steps.collect.outputs.tag }}
          files: dist/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-apks
          path: dist/*.apk
