name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v3.5.4)'
        required: false
        default: 'v3.5.4'

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-and-publish:
    name: Build APKs & attach to Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Setup Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
            cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          else
            echo "Keystore secret not found, generating release keystore..."
            keytool -genkey -v -keystore "$RUNNER_TEMP/release.jks" -alias freeturn -keyalg RSA -keysize 2048 -validity 10000 -storepass freeturn123 -keypass freeturn123 -dname "CN=FreeTurn, OU=Mobile, O=LiTar, C=RU"
            cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=freeturn123
          keyAlias=freeturn
          keyPassword=freeturn123
          EOF
          fi

      - name: Assemble release APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Collect APKs
        id: collect
        run: |
          TAG="${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}"
          VERSION="${TAG#v}"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a; do
            if [ -f "app/build/outputs/apk/release/app-${abi}-release.apk" ]; then
              cp "app/build/outputs/apk/release/app-${abi}-release.apk" "dist/freeturn-${VERSION}-${abi}.apk"
            fi
          done
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create / Update GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.collect.outputs.tag }}
          name: FreeTurn ${{ steps.collect.outputs.tag }}
          files: dist/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: dist/*.apk
