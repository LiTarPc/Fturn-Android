name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  # Ядро качается из релизов free-turn-proxy; токен - против anonymous rate limit API
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: false

      - name: Build sing-box Android library
        run: |
          sdkmanager 'ndk;28.2.13676358'
          bash scripts/build-libbox.sh

      - name: RAW bridge tests
        working-directory: third_party/raw-core
        env:
          GOTOOLCHAIN: go1.26.11
          GOTELEMETRY: 'off'
        run: go test -mod=readonly ./internal/bypass ./internal/captchaipc ./internal/provider/vk/... ./internal/rawsocks ./internal/rawvpn ./internal/transport/turndial

      - name: RAW cancellation and immediate reconnect race regression
        env:
          GOTOOLCHAIN: go1.26.11
          GOTELEMETRY: 'off'
        run: go -C third_party/raw-core test -race -mod=readonly ./internal/rawvpn ./internal/transport/turndial -run '^Test(CancellationDeadline|StoppingCancellationDeadline|ReadClientPacket|OrderlyClientCancellation|WriteDeadline|ChangingPending)' -count=100 -timeout=5m

      - name: Browser proof and authorization race regressions
        env:
          GOTOOLCHAIN: go1.26.11
          GOTELEMETRY: 'off'
        run: |
          go -C third_party/raw-core test -race -mod=readonly ./internal/captchaipc ./internal/provider/vk/... -count=1 -timeout=10m
          go -C third_party/freeturn-core test -race -mod=readonly ./internal/captchaipc ./internal/provider/vk/... -count=1 -timeout=10m
          node third_party/raw-core/internal/provider/vk/internal/captcha/manual/inject_fixture_test.cjs
          node scripts/tests/captcha_resource_paths.mjs
          node third_party/raw-core/internal/provider/vk/internal/captcha/manual/resource_paths_test.mjs

      - name: Delayed authorization and DTLS integration race regressions
        env:
          GOTOOLCHAIN: go1.26.11
          GOTELEMETRY: 'off'
        run: go -C third_party/freeturn-core test -race -mod=readonly -tags integration ./internal/proxy/tcprelay ./internal/proxy/udprelay ./internal/transport/dtlsdial -count=1 -timeout=10m

      - uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests and Android Lint
        run: |
          chmod +x gradlew
          ./gradlew :app:test :app:lintDebug

      - name: Native VLESS relay tests
        run: bash scripts/test-libbox.sh

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/
          retention-days: 7

  build:
    name: Debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: false

      - name: Build sing-box Android library
        run: |
          sdkmanager 'ndk;28.2.13676358'
          bash scripts/build-libbox.sh

      - uses: gradle/actions/setup-gradle@v6

      # -PcoreFetch=all - в CI ядро подложить руками некому, а APK-артефакт без него бесполезен
      - name: Assemble debug APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
