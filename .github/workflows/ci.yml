name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  # Ядро качается из релизов free-turn-proxy; токен - против anonymous rate limit API
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'
          cache: false

      - name: Build sing-box Android library
        run: |
          sdkmanager 'ndk;28.2.13676358'
          bash scripts/build-libbox.sh

      - uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:test

      - name: Native VLESS relay tests
        run: bash scripts/test-libbox.sh

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

  build:
    name: Debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'
          cache: false

      - name: Build sing-box Android library
        run: |
          sdkmanager 'ndk;28.2.13676358'
          bash scripts/build-libbox.sh

      - uses: gradle/actions/setup-gradle@v6

      # -PcoreFetch=all - в CI ядро подложить руками некому, а APK-артефакт без него бесполезен
      - name: Assemble debug APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PcoreFetch=all

      - uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
