name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

  build:
    name: Debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug and release APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Verify both ABI APKs include the core
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            apk="app/build/outputs/apk/debug/app-${abi}-debug.apk"
            test -s "$apk"
            unzip -Z1 "$apk" | grep -Fx "lib/${abi}/libgojni.so"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
